name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: android, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build all binaries
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
        run: |
          set -e
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/tele-tui${EXT}" ./cmd/teletui
          go build -trimpath -ldflags="-s -w" -o "dist/telegram-mcp${EXT}" ./cmd/telegram-mcp
          go build -trimpath -ldflags="-s -w" -o "dist/telegram-api${EXT}" ./cmd/telegram-api

      - name: Package
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          set -e
          PKG="telegram-cli_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "stage/${PKG}"
          cp dist/* "stage/${PKG}/"
          cp README.md LICENSE "stage/${PKG}/"
          mkdir -p release
          cd stage
          if [ "$GOOS" = "windows" ]; then
            zip -r "../release/${PKG}.zip" "${PKG}"
          else
            tar -czf "../release/${PKG}.tar.gz" "${PKG}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: release/
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd packages
          sha256sum *.tar.gz *.zip > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
