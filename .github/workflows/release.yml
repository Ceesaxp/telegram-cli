name: Release

# Deliberate releases only. Merging to main no longer publishes anything —
# a release happens in exactly two ways:
#   - push a v* tag, which is released as-is;
#   - run this workflow manually, choosing the bump level (patch by
#     default), and the version job computes the next tag from the latest
#     existing one.
# Every release then updates Formula/tele-tui.rb in Ceesaxp/homebrew-tap,
# so `brew upgrade` tracks releases with no manual step. The tap push
# needs the TAP_GITHUB_TOKEN secret (fine-grained PAT, contents: write on
# homebrew-tap only) — without it the release still publishes and only
# the tap step fails.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            LATEST=${LATEST:-v0.0.0}
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            case "${BUMP:-patch}" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *)     PATCH=$((PATCH+1)) ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              PATCH=$((PATCH+1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

  build:
    name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: android, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Through the Makefile rather than repeated here. A second packaging
      # path is a second thing to keep in step, and the one nobody runs by
      # hand is the one that rots — which is how config.example.toml came
      # to be missing from every archive this workflow ever published.
      #
      # `make dist` also stamps the version into the binaries, so a
      # downloaded build can say what it is.
      - name: Build and package
        run: |
          make dist \
            GOOS=${{ matrix.target.goos }} \
            GOARCH=${{ matrix.target.goarch }} \
            VERSION=${{ needs.version.outputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd packages
          sha256sum *.tar.gz *.zip > checksums.txt

      # softprops/action-gh-release creates the tag (pointing at this
      # commit) when it does not exist yet — this is what makes the
      # manual-dispatch flow tagless on the pusher's side.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: packages/*
          generate_release_notes: true

  tap:
    name: Update Homebrew tap
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          repository: Ceesaxp/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      # The formula pins one url + sha256 pair per platform. The sha256s
      # come from the artifacts this same run built — not re-downloaded
      # from the release — so the formula describes exactly the bytes that
      # were published, and a checksum mismatch here means the publish
      # itself is broken, which is the right moment to find out.
      #
      # sed's /url .../{n; s...} form rewrites the sha256 on the line
      # AFTER each matched url line, so the pairing survives without this
      # step having to understand Ruby.
      - name: Rewrite formula
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
          FORMULA=tap/Formula/tele-tui.rb
          for plat in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            PKG="telegram-cli_${TAG}_${plat}.tar.gz"
            test -f "packages/${PKG}" || { echo "missing ${PKG}"; exit 1; }
            SHA=$(sha256sum "packages/${PKG}" | cut -d' ' -f1)
            sed -i -E \
              "s|download/v[0-9.]+/telegram-cli_v[0-9.]+_${plat}\.tar\.gz|download/${TAG}/telegram-cli_${TAG}_${plat}.tar.gz|" \
              "$FORMULA"
            sed -i -E \
              "\|telegram-cli_${TAG}_${plat}\.tar\.gz|{n; s|sha256 \"[0-9a-f]{64}\"|sha256 \"${SHA}\"|;}" \
              "$FORMULA"
          done
          # Refuse to push a formula that still names any other version:
          # a leftover pin means the sed above silently missed a line.
          if grep -E "download/v[0-9.]+/" "$FORMULA" | grep -v "download/${TAG}/"; then
            echo "formula still pins another version"; exit 1
          fi
          git -C tap diff

      - name: Commit and push
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
          cd tap
          if git diff --quiet; then
            echo "formula already at ${TAG}, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tele-tui.rb
          git commit -m "tele-tui ${TAG#v}"
          git push
