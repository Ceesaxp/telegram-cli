name: Publish tdl

# gh workflow run publish-tdl.yml --ref main
on:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build the node addon on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
        if: runner.os == 'Linux'
      - name: Install dependencies
        run: npm install
      - name: Clean old binaries
        run: npm run clean -w tdl
      - name: Prebuildify (Linux via zig)
        if: runner.os == 'Linux'
        run: |
          CC="zig cc -target x86_64-linux-gnu.2.22" CXX="zig c++ -target x86_64-linux-gnu.2.22 -s" \
            npm exec -w tdl -c 'prebuildify --napi -t 20.20.1 --arch x64 --libc glibc --tag-libc'
          CC="zig cc -target aarch64-linux-gnu.2.22" CXX="zig c++ -target aarch64-linux-gnu.2.22 -s" \
            npm exec -w tdl -c 'prebuildify --napi -t 20.20.1 --arch arm64 --armv 8 --tag-armv --libc glibc --tag-libc'
          CC="zig cc -target x86_64-linux-musl" CXX="zig c++ -target x86_64-linux-musl -s" \
            npm exec -w tdl -c 'prebuildify --napi -t 20.20.1 --arch x64 --libc musl --tag-libc'
          CC="zig cc -target aarch64-linux-musl" CXX="zig c++ -target aarch64-linux-musl -s" \
            npm exec -w tdl -c 'prebuildify --napi -t 20.20.1 --arch arm64 --armv 8 --tag-armv --libc musl --tag-libc'
          ldd packages/tdl/prebuilds/*-x64/*.glibc.node
      - name: Prebuildify (Windows x86_64)
        if: runner.os == 'Windows'
        run: npm exec -w tdl -c 'prebuildify --napi -t 20.20.1 --arch x64 --strip'
      - name: Info
        run: |
          file packages/tdl/prebuilds/*/*.node
          du -hsc packages/tdl/prebuilds/*/*.node
      - name: Run tests (unit tests + integration tests)
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: tdl-prebuilds-${{ matrix.os }}
          path: packages/tdl/prebuilds
