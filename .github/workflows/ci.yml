name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vet
        run: go vet ./...

      # `test -z "$(gofmt -l .)"` was the whole check, and on failure it said
      # nothing at all — exit code 1, no file named, no diff. Both times this
      # job has ever gone red it was this step, and both times the only way
      # to find out WHAT was unformatted was to run gofmt again locally.
      # `make fmt` fixes whatever this reports.
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: the following files are not formatted. Run 'make fmt'."
            echo "$unformatted" | sed 's/^/  /'
            echo
            gofmt -d .
            exit 1
          fi
          echo "gofmt: clean"

      # always(), so a stray blank line does not hide whether the tests pass.
      # Previously Format check failing skipped this step, which cost a whole
      # extra round trip to learn anything about the actual code: fix the
      # whitespace, push, and only then find out if something was broken.
      - name: Test
        if: always()
        run: go test ./...

  build:
    name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: android, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build all binaries
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
        run: |
          set -e
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/tele-tui${EXT}" ./cmd/teletui
          go build -trimpath -ldflags="-s -w" -o "dist/telegram-mcp${EXT}" ./cmd/telegram-mcp
          go build -trimpath -ldflags="-s -w" -o "dist/telegram-api${EXT}" ./cmd/telegram-api

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-cli-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/
          retention-days: 7
