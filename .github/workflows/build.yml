name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.os == 'windows-latest' && 'bin/tele-tui.exe' || 'bin/tele-tui' }} ./cmd/teletui
        env:
          CGO_ENABLED: 0

      - uses: actions/upload-artifact@v4
        with:
          name: tele-tui-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'windows-latest' && 'windows' || 'macos' }}-amd64
          path: bin/

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir release
          cp artifacts/tele-tui-linux-amd64/tele-tui release/tele-tui-linux-amd64
          cp artifacts/tele-tui-macos-amd64/tele-tui release/tele-tui-macos-amd64
          chmod +x release/tele-tui-linux-amd64 release/tele-tui-macos-amd64
          cp artifacts/tele-tui-windows-amd64/tele-tui.exe release/tele-tui-windows-amd64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
