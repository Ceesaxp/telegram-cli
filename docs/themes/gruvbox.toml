# Gruvbox (dark, hard background) for tele-tui.
# Palette: morhetz/gruvbox — colors/gruvbox.vim (hex and cterm).
# Copy into ~/.config/tele-tui/themes/ and set  ui.theme = "gruvbox"  in config.toml.

[theme]
name    = "gruvbox"
inherit = "dark"

[colors]
# Surfaces, darkest context first.
bg        = "#1d2021"
panel     = "#282828"
chrome    = "#32302f"
sel       = "#3c3836"
cur_line  = "#32302f"
rule      = "#504945"
rule_soft = "#3c3836"
border    = "#665c54"

# Text ramp, dimmest to brightest.
ghost     = "#665c54"
faint     = "#7c6f64"
dim       = "#928374"
fg        = "#ebdbb2"
bright    = "#fbf1c7"

# Semantic accents.
cyan      = "#8ec07c"
amber     = "#d79921"
green     = "#b8bb26"
mauve     = "#d3869b"
blue      = "#83a598"
red       = "#fb4934"

# Hand-picked xterm-256 values, from the scheme's own cterm table.
[colors256]
bg        = "234"
panel     = "235"
chrome    = "236"
sel       = "237"
cur_line  = "236"
rule      = "239"
rule_soft = "237"
border    = "241"
ghost     = "241"
faint     = "243"
dim       = "245"
fg        = "223"
bright    = "229"
cyan      = "108"
amber     = "172"
green     = "142"
mauve     = "175"
blue      = "109"
red       = "167"
