# Rosé Pine (main) for tele-tui.
# Palette: rose-pine/neovim — lua/rose-pine/palette.lua; rose-pine/rose-pine-palette.
# Copy into ~/.config/tele-tui/themes/ and set  ui.theme = "rose-pine"  in config.toml.
# Rosé Pine has no true green: its muted leaf stands in. Rose is the focus accent, and foam the blue (pine is too dark for names).

[theme]
name    = "rose-pine"
inherit = "dark"

[colors]
# Surfaces, darkest context first.
bg        = "#191724"
panel     = "#1f1d2e"
chrome    = "#1f1d2e"
sel       = "#403d52"
cur_line  = "#26233a"
rule      = "#26233a"
rule_soft = "#21202e"
border    = "#6e6a86"

# Text ramp, dimmest to brightest.
ghost     = "#524f67"
faint     = "#6e6a86"
dim       = "#908caa"
fg        = "#e0def4"
bright    = "#e0def4"

# Semantic accents.
cyan      = "#ebbcba"
amber     = "#f6c177"
green     = "#95b1ac"
mauve     = "#c4a7e7"
blue      = "#9ccfd8"
red       = "#eb6f92"
