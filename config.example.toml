# Tele-TUI Configuration
# Copy this file to ~/.config/tele-tui/config.toml

# Obtain API credentials from https://my.telegram.org/apps
[telegram]
api_id = 0
api_hash = ""
phone = ""

# Session and file storage paths
[storage]
session_file = "~/.local/share/tele-tui/session.json"
# The media CACHE: where downloads land so a photo drawn twice is fetched
# once. This is not where "save this" saves to — that is download_dir.
files_dir = "~/.local/share/tele-tui/files"

# Where 's' puts a copy, under the sender's own filename — and where the
# ctrl+t attach picker opens the first time, so the place the client saves to
# is the place it offers back. After that the picker reopens wherever it was
# last left.
download_dir = "~/Downloads"
# state_file = "~/.local/share/tele-tui/state.db"  # update/peer state DB (default: state.db next to session_file)

# Which directories a REMOTE caller may send files from: the `send_file` MCP
# tool and POST /api/send-file. It does not constrain the TUI, where the
# person picking the file is the person running the program.
#
# files_dir is always allowed on top of this list (download_media hands out
# paths inside it), and telegram-mcp/telegram-api log the effective set at
# startup. Note what is NOT here: ~/Downloads, and the directory the server
# happened to be started from. For MCP the caller is a language model reading
# incoming messages from strangers, so this list is the answer to "which
# files can a message talk it into sending".
send_dirs = ["~/.local/share/tele-tui/outbox"]

# UI preferences
[ui]
theme = "dark"               # "dark" or "light"

# INERT. Both are read back and written out so an existing config
# round-trips, and nothing consults either one.
#
# Every time on screen has a fixed form chosen for the column it sits in:
# the thread's clock is 15:04 because the grid gives it five cells and puts
# the date in a day divider above; the chat list is relative — 2m, 4h, yd,
# 2d — because a chat list is read for recency; a day divider names the day.
# One layout string cannot express three different jobs, and one that
# overrode all three would break the column widths the frame is built on.
timestamp_format = "15:04"
date_format = "2006-01-02"

# Where a photo is drawn.
#   "never"    the metadata card, and Enter opens the picture externally
#   "on_open"  the card in the thread, the picture full-pane on Enter (default)
#   "always"   as on_open, plus an eight-row preview inline
#
# The eight rows are a cap, not a suggestion, and media.max_image_height does
# not raise it: a message whose height changes when its thumbnail lands moves
# the history under you mid-scroll, because the scroll positions and the }/{
# motions are computed from the height of every message above.
inline_images = "on_open"

# Show the right-hand context rail on a wide terminal. It costs 30 columns,
# and they come out of the thread.
rail = false

# OSC 8 terminal hyperlinks on links in a message: "auto" (only on terminals
# known to support them), "never", or "always".
#
# "auto" is an allowlist rather than a denylist, because the failure is
# asymmetric: a terminal that ignores the sequence loses nothing but the
# click, and one that prints it puts a URL in the middle of somebody's
# message. Links are cyan and underlined either way — this only adds the
# click.
#
# tmux is excluded from "auto" whatever the terminal under it is: OSC 8 only
# gets through with allow-passthrough on, which is off by default and cannot
# be detected from the environment. Set "always" if you have turned it on.
hyperlinks = "auto"

# How this terminal draws emoji sequences that have a composition rule —
# a base plus U+FE0F ("❤️"), a ZWJ sequence ("👨‍👩‍👧"), a flag ("🇷🇸"):
#
#   "auto"     — don't assume; keep room for whichever rendering is wider
#   "composed" — it applies every rule: one glyph, two cells
#   "separate" — it applies none: the selector is ignored and the base drawn
#                as text, and joined or paired sequences are drawn as parts
#
# It is a declaration because it cannot be detected. The width is the
# terminal's decision, no environment variable reports it, and the runtime
# query that would ask was removed for leaking its answer into the composer.
#
# Symptom of "composed" on a terminal that is actually "separate": a gap of
# a few cells between the folder tabs and the clock, because the row was
# laid out wider than it drew. There is no harm in trying the other value —
# set it, look at the top bar, keep whichever ends flush.
emoji_width = "auto"

# Line editing in the composer: "emacs" (readline chords), "vi" (modal),
# or "auto" to follow $VISUAL/$EDITOR.
compose_editing = "auto"

# Format outgoing messages with Telegram's markdown subset.
#
# WARNING: this rewrites what you typed. **bold**, __italic__, `code`,
# ```pre```, ~~strike~~, ||spoiler|| and [text](url) are consumed as
# formatting and the markers disappear from the sent message — so __init__
# arrives as init, and a pasted snippet can lose characters. There is no
# preview in the composer, so you only see the result after sending.
# The built-in default is false; this example turns it on deliberately.
parse_markdown = true

# Media settings
[media]
image_protocol = "auto"      # "auto", "sixel", "kitty", "blocks"
max_image_width = 40         # columns
max_image_height = 20        # rows
voice_player = "mpv"         # "mpv", "ffplay", "paplay"
video_player = "mpv"         # "mpv", "vlc", "xdg-open"
auto_download_photos = true
auto_download_limit_mb = 10

# INERT, and kept for the same round-tripping reason as ui.timestamp_format.
# Voice notes are never prefetched: one is fetched when you press space on
# it, which is the only moment anybody wants the bytes.
auto_download_voice = true

# Notification settings
[notifications]
enabled = true
sound = false
show_preview = true

# Who posts the notification:
#
#   "auto"     — the terminal, where it is known to understand the escape
#                sequence; the system otherwise. The default.
#   "terminal" — always the terminal, for one the allowlist does not know.
#                A terminal that does not understand it PRINTS it, into
#                whatever is on screen.
#   "system"   — always the platform notifier: notify-send on Linux,
#                osascript on macOS.
#
# The terminal is preferred because it is an application with a name, an
# icon and a notification permission the user granted on purpose — and
# because it is on the machine the user is looking at, which over ssh the
# system notifier is not.
#
# On macOS "system" posts as **Script Editor**: osascript really is Script
# Editor, so the alert carries its name, its icon and its notification
# settings. A command-line binary cannot post under its own name there at
# all — that needs an app bundle — which is why the terminal does it.
#
# Known to understand it: kitty, Ghostty, WezTerm, foot, urxvt (title and
# body); iTerm2, Windows Terminal (body only, so the sender is folded into
# the message). Terminal.app implements none, and falls back to the system.
# Under tmux or screen nothing is sent: whether the sequence gets through
# depends on configuration that cannot be read from here.
method = "auto"

# Keybindings — values below are the built-in defaults (see defaultConfig()
# in internal/config/config.go). Every field follows one rule:
#
#   A value REPLACES the default. A value that collides with anything
#   already bound — another field here, or a key a panel owns outright —
#   is REFUSED: the default keeps working and the client says so on
#   stderr at startup. The "?" help card shows an action left with no key
#   at all as "(unbound)".
#
# These are matched before the focused panel sees the key, so a bare
# printable shadows that key in the chat list and the chat view. It does
# not shadow it in the composer: typing is only ever entered deliberately
# (i, Tab, an action that needs text, or a click). "quit" is the one
# exception — it is matched before every focus check, so a bare printable
# there would be untypable in a message, and is refused outright.
#
# The motions are not configurable and are not meant to be: j/k, the
# arrows, g/G, ctrl+e/ctrl+y, ctrl+d/ctrl+u and the page keys are vi's.
# See docs/interaction-model.md for the whole keymap.
#
# Modifiers and key names are case-insensitive ("Escape" == "esc"), but a
# lone printable letter is NOT: "J" and "j" are different keys, which is
# why next_chat below is uppercase and the chat list's own j still moves
# the cursor.
[keys]
quit = "ctrl+q"               # from anywhere, without asking; a bare printable is refused
quit_browsing = "q"           # chat list / chat view only; confirms first if the composer holds a draft
search = "/"                  # find in the buffer in front of you
global_search = "ctrl+g"      # search every chat, from any panel
contacts = "c"                # toggle the contacts overlay
compose = "i"                 # open the cursored chat and focus the composer
help = "?"
next_chat = "J"               # open the next chat outright, unlike the list's own j
prev_chat = "K"
next_unread = "u"             # next chat with unread messages, wrapping once
next_folder = "]"
prev_folder = "["
reply = "r"                   # acts on the cursored message in the chat view
edit_message = "e"
delete_message = "d"
forward = "f"                 # forward the cursored message to another chat
mark_read = "m"               # mark the open chat read without moving
