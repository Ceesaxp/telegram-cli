# Tele-TUI Configuration
# Copy this file to ~/.config/tele-tui/config.toml

# Obtain API credentials from https://my.telegram.org/apps
[telegram]
api_id = 0
api_hash = ""
phone = ""

# Session and file storage paths
[storage]
session_file = "~/.local/share/tele-tui/session.json"
files_dir = "~/.local/share/tele-tui/files"
# state_file = "~/.local/share/tele-tui/state.db"  # update/peer state DB (default: state.db next to session_file)

# UI preferences
[ui]
theme = "dark"               # "dark" or "light"
timestamp_format = "15:04"   # Go time format
date_format = "2006-01-02"

# Where a photo is drawn.
#   "never"    the metadata card, and Enter opens the picture externally
#   "on_open"  the card in the thread, the picture full-pane on Enter (default)
#   "always"   as on_open, plus an eight-row preview inline
#
# The eight rows are a cap, not a suggestion, and media.max_image_height does
# not raise it: a message whose height changes when its thumbnail lands moves
# the history under you mid-scroll, because the scroll positions and the }/{
# motions are computed from the height of every message above.
inline_images = "on_open"

# Show the right-hand context rail on a wide terminal. It costs 30 columns,
# and they come out of the thread.
rail = false

# OSC 8 terminal hyperlinks on links in a message: "auto" (only on terminals
# known to support them), "never", or "always".
#
# "auto" is an allowlist rather than a denylist, because the failure is
# asymmetric: a terminal that ignores the sequence loses nothing but the
# click, and one that prints it puts a URL in the middle of somebody's
# message. Links are cyan and underlined either way — this only adds the
# click.
#
# tmux is excluded from "auto" whatever the terminal under it is: OSC 8 only
# gets through with allow-passthrough on, which is off by default and cannot
# be detected from the environment. Set "always" if you have turned it on.
hyperlinks = "auto"

# Line editing in the composer: "emacs" (readline chords), "vi" (modal),
# or "auto" to follow $VISUAL/$EDITOR.
compose_editing = "auto"

# Format outgoing messages with Telegram's markdown subset.
#
# WARNING: this rewrites what you typed. **bold**, __italic__, `code`,
# ```pre```, ~~strike~~, ||spoiler|| and [text](url) are consumed as
# formatting and the markers disappear from the sent message — so __init__
# arrives as init, and a pasted snippet can lose characters. There is no
# preview in the composer, so you only see the result after sending.
# The built-in default is false; this example turns it on deliberately.
parse_markdown = true

# Media settings
[media]
image_protocol = "auto"      # "auto", "sixel", "kitty", "blocks"
max_image_width = 40         # columns
max_image_height = 20        # rows
voice_player = "mpv"         # "mpv", "ffplay", "paplay"
video_player = "mpv"         # "mpv", "vlc", "xdg-open"
auto_download_photos = true
auto_download_voice = true
auto_download_limit_mb = 10

# Notification settings
[notifications]
enabled = true
sound = false
show_preview = true

# Keybindings — values below are the built-in defaults (see defaultConfig()
# in internal/config/config.go); only listed fields are actually consulted,
# see the KeyConfig doc comment there for which.
#
# Wired app-level bindings (quit through prev_folder) are matched before
# the focused panel sees the key, so a bare printable binding (e.g.
# quit_browsing = "q") shadows that key in the chat list and chat view.
# MOST of them never reach the composer — it only ever gets focus
# deliberately (i, c, Tab, a focus key, or a click), and app-level
# dispatch claims almost nothing while it's focused — but "quit" is the
# exception: it is matched before every other check in Update, focus
# included, so quit = "x" means pressing x while writing a message quits
# the app instead of typing an x. Nothing rejects that. Prefer a chord or
# a function key for quit especially.
#
# reply/edit_message/delete_message are mnemonics: a value here REPLACES
# the chat view's built-in r/e/d. scroll_up/scroll_down/page_up/page_down
# are motions: a value here is ADDED alongside the always-live
# k/j/arrows/pgup/pgdown, which keep working regardless. Either way, a
# value that collides with a key already claimed elsewhere (the chat
# view's own g/G, ctrl+u/ctrl+d, n/N, ctrl+f, enter/o/s, or the app-level
# surface: h, l, i, c, tab, ctrl+v, and whatever quit/quit_browsing/help/
# search/global_search/contacts/contacts_alt resolve to) is REFUSED, not
# silently double-bound — the built-in keeps working and the configured
# value is just never reached. Two things surface a refusal: running
# -migrate-config (see the README) reports it as a warning, and the "?"
# help card shows the now-unreachable action as "(unbound)" instead of a
# blank or the wrong key.
[keys]
quit = "ctrl+q"
quit_browsing = "q"          # quits from the chat list/chat view only; confirms first if the composer holds a draft or attachment
focus_chat_list = "f1"
focus_chat_view = "f2"
focus_composer = "f3"
search = "/"
global_search = "ctrl+g"
contacts = "alt+c"
contacts_alt = "f4"
help = "?"
next_chat = "alt+j"
prev_chat = "alt+k"
reply = "r"                   # mnemonic: replaces the chat view's built-in "r" (refused, falling back to "r", on a collision)
edit_message = "e"            # mnemonic: replaces the built-in "e"
delete_message = "d"          # mnemonic: replaces the built-in "d"
forward = "f"                 # accepted for round-trip compatibility only — no forward-message feature exists to dispatch it to
scroll_up = "k"                # motion: adds to the always-live k/up (refused, adding nothing, on a collision)
scroll_down = "j"              # motion: adds to the always-live j/down
page_up = "pgup"                # motion: adds to the always-live PgUp
page_down = "pgdown"            # motion: adds to the always-live PgDn
next_folder = "alt+l"
prev_folder = "alt+h"
